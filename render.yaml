# ============================================================
# Render Blueprint — Agentic Enterprise Knowledge Copilot
# https://render.com/docs/blueprint-spec
# ============================================================
#
# BEFORE deploying, set these secret env vars in the Render dashboard:
#   - GEMINI_API_KEY          (required)
#   - QDRANT_URL              (required — get from https://cloud.qdrant.io)
#   - QDRANT_API_KEY          (required — get from Qdrant Cloud dashboard)
#   - LANGSMITH_API_KEY       (optional — for LangSmith tracing)
#
# Then connect this repo in Render -> New -> Blueprint.
# ============================================================

services:
  # ============================================================
  # Web Service - FastAPI Multi-Agent Copilot
  # ============================================================
  - type: web
    name: agentic-enterprise-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash

      - key: DATABASE_URL
        fromDatabase:
          name: copilot-postgres
          property: connectionString

      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: enterprise_documents
      - key: QDRANT_PREFER_MEMORY
        value: false

      - key: REDIS_URL
        fromService:
          name: copilot-redis
          type: redis
          property: connectionString
      - key: REDIS_ENABLED
        value: true
      - key: CACHE_TTL_SECONDS
        value: 3600

      - key: GUARDRAILS_ENABLED
        value: true
      - key: INJECTION_STRICTNESS
        value: "0.85"

      - key: LANGSMITH_TRACING
        value: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: agentic-enterprise-copilot
      - key: JAEGER_ENABLED
        value: false

  # ============================================================
  # Managed Redis
  # ============================================================
  - type: redis
    name: copilot-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

# ============================================================
# Managed PostgreSQL
# ============================================================
databases:
  - name: copilot-postgres
    plan: free
    region: oregon
    databaseName: aegisdb
