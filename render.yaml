# ============================================================
# Render Blueprint — Agentic Enterprise Knowledge Copilot
# https://render.com/docs/blueprint-spec
# ============================================================
#
# BEFORE deploying, set these secret env vars in the Render dashboard:
#   - GEMINI_API_KEY          (required)
#   - QDRANT_URL              (optional — for persistent Qdrant Cloud; omit to use fast in-memory mode)
#   - QDRANT_API_KEY          (optional — only needed if QDRANT_URL is set)
#   - LANGSMITH_API_KEY       (optional — for LangSmith tracing)
#
# NOTE: With QDRANT_PREFER_MEMORY=true the app auto-indexes bundled PDFs from
#       data/raw/ at startup. No external Qdrant cluster is required.
#
# Then connect this repo in Render -> New -> Blueprint.
# ============================================================

services:
  # ============================================================
  # Web Service - FastAPI Multi-Agent Copilot
  # ============================================================
  - type: web
    name: agentic-enterprise-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000

      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash

      - key: DATABASE_URL
        fromDatabase:
          name: copilot-postgres
          property: connectionString

      - key: QDRANT_URL
        sync: false         # Optional: set to a Qdrant Cloud URL for persistence across deploys
      - key: QDRANT_API_KEY
        sync: false         # Optional: only needed when QDRANT_URL is set
      - key: QDRANT_COLLECTION
        value: enterprise_documents
      - key: QDRANT_PREFER_MEMORY
        value: true          # In-memory mode: PDFs in data/raw/ are auto-indexed at every startup
      - key: USE_GEMINI_EMBEDDINGS
        value: "true"        # Use Gemini API embeddings (eliminates PyTorch -> 512MB RAM fit)
      - key: EMBEDDING_VECTOR_SIZE
        value: "768"         # 768 dimensions for gemini-embedding-001

      - key: REDIS_URL
        fromService:
          name: copilot-redis
          type: redis
          property: connectionString
      - key: REDIS_ENABLED
        value: true
      - key: CACHE_TTL_SECONDS
        value: 3600

      - key: GUARDRAILS_ENABLED
        value: true
      - key: INJECTION_STRICTNESS
        value: "0.85"

      - key: LANGSMITH_TRACING
        value: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: agentic-enterprise-copilot
      - key: JAEGER_ENABLED
        value: false

  # ============================================================
  # Managed Redis
  # ============================================================
  - type: redis
    name: copilot-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru

# ============================================================
# Managed PostgreSQL
# ============================================================
databases:
  - name: copilot-postgres
    plan: free
    region: oregon
    databaseName: aegisdb
