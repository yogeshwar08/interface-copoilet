apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: enterprise-copilot
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/enterprise-copilot:latest
          resources:
            limits:
              cpu: "2000m"
              memory: "2Gi"
          ports:
            - name: http1
              containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: GEMINI_MODEL_NAME
              value: "gemini-2.5-flash"
            - name: QDRANT_PREFER_MEMORY
              value: "false"
            - name: REDIS_ENABLED
              value: "true"
            - name: GUARDRAILS_ENABLED
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-connection-string
                  key: latest
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: memorystore-redis-url
                  key: latest
            - name: QDRANT_HOST
              valueFrom:
                secretKeyRef:
                  name: qdrant-host
                  key: latest
